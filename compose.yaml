name: gallery-de31
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Create .env from .env.example}
      MYSQL_DATABASE: gallery
      MYSQL_USER: gallery_app
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:?Create .env from .env.example}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?Set EXPORTER_DB_PASSWORD in .env}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
  app:
    build: ./app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: gallery
      DB_USER: gallery_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?Create .env from .env.example}
    networks: [web, database]
    depends_on:
      mysql: {condition: service_healthy}
    volumes: ["uploads:/app/uploads", "app_logs:/app/logs"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
      - "127.0.0.1:${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    networks: [web]
    depends_on:
      app: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 4
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 16M
    ports: ["127.0.0.1:${PMA_PORT:-8081}:80"]
    networks: [management, database]
    depends_on:
      mysql: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    networks: [web, database, observability]
    depends_on: [app, nginx, mysqld-exporter, nginx-exporter, cadvisor]
    security_opt: ["no-new-privileges:true"]
  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./logging/loki.yml:/etc/loki/local-config.yaml:ro", "loki_data:/loki"]
    networks: [observability]
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
  promtail:
    image: grafana/promtail:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes: ["./logging/promtail.yml:/etc/promtail/config.yml:ro", "/var/lib/docker/containers:/var/lib/docker/containers:ro", "/var/run/docker.sock:/var/run/docker.sock:ro", "promtail_positions:/tmp/positions"]
    networks: [observability]
    depends_on:
      loki: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
    volumes: ["grafana_data:/var/lib/grafana", "./monitoring/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    networks: [observability]
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    volumes: ["/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker:/var/lib/docker:ro", "/dev/disk:/dev/disk:ro"]
    networks: [observability]
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD:?Set EXPORTER_DB_PASSWORD in .env}
    networks: [database, observability]
    depends_on: [mysql]
    security_opt: ["no-new-privileges:true"]
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8080/nginx_status"]
    networks: [web, observability]
    depends_on: [nginx]
    security_opt: ["no-new-privileges:true"]

networks:
  web: {}
  management: {}
  database: {internal: true}
  observability: {}
volumes:
  mysql_data: {}
  uploads: {}
  app_logs: {}
  nginx_logs: {}
  prometheus_data: {}
  grafana_data: {}


  loki_data: {}
  promtail_positions: {}
