server {
  listen 8080;
  server_name _;
  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = /nginx_status { access_log off; stub_status; allow 127.0.0.1; allow 172.16.0.0/12; deny all; }
  location / { return 308 https://$host:8443$request_uri; }
}

server {
  listen 8443 ssl;
  server_name _;
  access_log /var/log/nginx/access.log combined;
  error_log /var/log/nginx/error.log warn;
  ssl_certificate /etc/nginx/certs/gallery-self-signed.crt;
  ssl_certificate_key /etc/nginx/certs/gallery-self-signed.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self';" always;
  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = /nginx_status { access_log off; stub_status; allow 127.0.0.1; allow 172.16.0.0/12; deny all; }
  location / {
    set $gallery_upstream http://app:3000;
    proxy_pass $gallery_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
      charset utf-8;
    proxy_read_timeout 30s;
  }
}
